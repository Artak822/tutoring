{% extends 'main/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; padding: 64px 0;">
    <div class="page-header" style="justify-content: center; margin-bottom: 32px;">
        <h1>Вход</h1>
    </div>

    <form method="post" style="background: var(--surface); padding: 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow);">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label" for="id_username">Имя пользователя</label>
            <input type="text" name="username" id="id_username" class="form-input" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-input" required>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger" style="margin-bottom: 24px;">
            Неверное имя пользователя или пароль.
        </div>
        {% endif %}

        <div class="form-actions">
            <button type="submit" class="btn" style="width: 100%;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                Войти
            </button>
        </div>

        <div style="text-align: center; margin-top: 24px; color: var(--text-secondary);">
            Нет аккаунта? <a href="{% url 'register' %}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Зарегистрироваться</a>
        </div>
    </form>
</div>
{% endblock %}
