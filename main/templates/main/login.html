{% extends 'main/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2 style="margin-bottom: 30px; font-weight: 400; font-size: 24px; text-align: center;">Вход в систему</h2>

    <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="message error">
                Неверное имя пользователя или пароль.
            </div>
        {% endif %}
        
        <div class="form-group">
            <label class="form-label" for="id_username">Имя пользователя</label>
            <input type="text" name="username" id="id_username" class="form-input" required autofocus>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-input" required>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn">Войти</button>
            <a href="{% url 'register' %}" class="btn btn-secondary">Регистрация</a>
        </div>
    </form>
</div>
{% endblock %}
