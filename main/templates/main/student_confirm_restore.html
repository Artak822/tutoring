{% extends 'main/base.html' %}

{% block title %}Восстановить ученика{% endblock %}

{% block content %}
<div style="margin-bottom: 24px;">
    <a href="{% url 'student_archive' %}" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Назад
    </a>
</div>

<div class="page-header">
    <h1>Восстановить ученика</h1>
</div>

<div class="card" style="max-width: 600px;">
    <p style="margin-bottom: 24px; font-size: 16px;">
        Восстановить ученика <strong>{{ student.last_name }} {{ student.first_name }}</strong> из архива?
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
                </svg>
                Восстановить
            </button>
            <a href="{% url 'student_archive' %}" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
