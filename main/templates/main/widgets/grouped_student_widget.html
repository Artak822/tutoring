<div class="grouped-student-selector" data-widget-name="{{ widget.name }}">
    <style>
        .grouped-student-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 8px;
            align-items: start;
        }

        .student-group-block {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: border-color 0.15s ease;
        }

        .student-group-block.selected {
            border-color: var(--primary);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-secondary);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
        }

        .group-header:hover {
            background: var(--bg-tertiary);
        }

        .student-group-block.selected .group-header {
            background: var(--primary-light);
        }

        .group-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .student-group-block.selected .group-name {
            color: var(--primary);
        }

        .group-count {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .student-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1px;
            background: var(--border);
        }

        .student-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface);
            cursor: pointer;
            transition: background 0.12s ease;
            user-select: none;
        }

        .student-item:hover {
            background: var(--bg-secondary);
        }

        .student-item.selected {
            background: var(--primary-light);
        }

        .student-item input[type="checkbox"] {
            display: none;
        }

        .student-item-check {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s ease;
        }

        .student-item.selected .student-item-check {
            background: var(--primary);
            border-color: var(--primary);
        }

        .student-item.selected .student-item-check::after {
            content: '';
            display: block;
            width: 7px;
            height: 4px;
            border-left: 1.5px solid white;
            border-bottom: 1.5px solid white;
            transform: rotate(-45deg) translateY(-1px);
        }

        .student-item-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            line-height: 1.3;
        }

        .student-item.selected .student-item-label {
            color: var(--primary);
            font-weight: 600;
        }

        .no-group-section {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            grid-column: 1 / -1;
        }

        .no-group-title {
            padding: 10px 14px;
            background: var(--bg-secondary);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>

    {% for group in groups %}
    <div class="student-group-block" data-group-id="{{ group.pk }}">
        <div class="group-header">
            <div class="group-name">{{ group.name }}</div>
            <div class="group-count">{{ group.students.count }} уч.</div>
        </div>
        <div class="student-items">
            {% for student in group.students.all %}
            <div class="student-item" data-student-id="{{ student.pk }}" data-group-id="{{ group.pk }}" data-default-price="{{ student.default_price|default:'' }}">
                <input type="checkbox"
                       name="{{ widget.name }}"
                       value="{{ student.pk }}"
                       id="student_{{ student.pk }}"
                       {% if student.pk|stringformat:"s" in widget.value|default_if_none:"" %}checked{% endif %}>
                <div class="student-item-check"></div>
                <label class="student-item-label" for="student_{{ student.pk }}">
                    {{ student.first_name }} {{ student.last_name }}
                </label>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    {% if students_without_groups %}
    <div class="no-group-section">
        <div class="no-group-title">Без группы</div>
        <div class="student-items">
            {% for student in students_without_groups %}
            <div class="student-item" data-student-id="{{ student.pk }}" data-default-price="{{ student.default_price|default:'' }}">
                <input type="checkbox"
                       name="{{ widget.name }}"
                       value="{{ student.pk }}"
                       id="student_{{ student.pk }}"
                       {% if student.pk|stringformat:"s" in widget.value|default_if_none:"" %}checked{% endif %}>
                <div class="student-item-check"></div>
                <label class="student-item-label" for="student_{{ student.pk }}">
                    {{ student.first_name }} {{ student.last_name }}
                </label>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <script>
    (function() {
        const selector = document.querySelector('.grouped-student-selector[data-widget-name="{{ widget.name }}"]');
        if (!selector) return;

        function updateGroupState(block) {
            if (!block) return;
            const checkboxes = block.querySelectorAll('input[type="checkbox"]');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            block.classList.toggle('selected', checkedCount === checkboxes.length && checkedCount > 0);
        }

        selector.querySelectorAll('.student-item').forEach(item => {
            const checkbox = item.querySelector('input[type="checkbox"]');

            if (checkbox.checked) item.classList.add('selected');

            item.addEventListener('click', function(e) {
                if (e.target.tagName === 'LABEL') return;
                checkbox.checked = !checkbox.checked;
                item.classList.toggle('selected', checkbox.checked);
                updateGroupState(item.closest('.student-group-block'));
            });
        });

        selector.querySelectorAll('.group-header').forEach(header => {
            const block = header.closest('.student-group-block');
            updateGroupState(block);

            header.addEventListener('click', function(e) {
                e.stopPropagation();
                const checkboxes = block.querySelectorAll('input[type="checkbox"]');
                const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                checkboxes.forEach(cb => {
                    cb.checked = !allChecked;
                    cb.closest('.student-item').classList.toggle('selected', !allChecked);
                });
                updateGroupState(block);
            });
        });
    })();
    </script>
</div>
